modLoader="javafml"
loaderVersion="[47,)"
license="All Rights Reserved"

[[mods]]
modId="fabricate"
version="${mod_version}"
displayName="Fabricate"
description='''Craft your items using base materials!'''

[[dependencies.fabricate]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.fabricate]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.21)"
    ordering="NONE"
    side="BOTH"

# JEI is required on the client - it's the baseline recipe viewer Fabricate
# integrates with. EMI is optional; when present it takes priority over JEI
# (its recipe-reload hook is skipped on JEMI setups to avoid duplicate-id
# errors - see EmiCompat#reloadRecipes). Dedicated servers need neither.
[[dependencies.fabricate]]
    modId="jei"
    mandatory=true
    versionRange="[15,)"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.fabricate]]
    modId="emi"
    mandatory=false
    versionRange="[1.1,)"
    ordering="AFTER"
    side="CLIENT"

[[mixins]]
config="fabricate.mixins.json"
