modLoader="javafml"
loaderVersion="[47,)"
license="All Rights Reserved"

[[mods]]
modId="fabricate"
version="${mod_version}"
displayName="Fabricate"
description='''Craft your items using base materials!'''

[[dependencies.fabricate]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.fabricate]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.21)"
    ordering="NONE"
    side="BOTH"

# Recipe viewers. At least one of EMI or JEI must be installed on the client;
# Fabricate.initClientIntegrations enforces this at construction time and
# refuses to load with a clear error when neither is present. Forge's TOML
# format has no "OR" between deps, so both are listed as mandatory=false
# here and the requirement is enforced in code. When both are present EMI
# wins. Dedicated servers need neither.
[[dependencies.fabricate]]
    modId="jei"
    mandatory=false
    versionRange="[15,)"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.fabricate]]
    modId="emi"
    mandatory=false
    versionRange="[1.1,)"
    ordering="AFTER"
    side="CLIENT"

[[mixins]]
config="fabricate.mixins.json"
