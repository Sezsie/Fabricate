modLoader="javafml"
loaderVersion="[47,)"
license="All Rights Reserved"

[[mods]]
modId="fabricate"
version="${mod_version}"
displayName="Fabricate"
description='''Craft your items using base materials!'''

[[dependencies.fabricate]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.fabricate]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.21)"
    ordering="NONE"
    side="BOTH"

[[dependencies.fabricate]]
    modId="polymorph"
    mandatory=true
    versionRange="[0.49.5,)"
    ordering="AFTER"
    side="BOTH"

# Optional recipe-viewer integrations. The mod boots fine without either; if
# both are present JEI takes priority (EMI's recipe-reload hook is skipped to
# avoid JEMI duplicate-id errors - see EmiCompat#reloadRecipes).
[[dependencies.fabricate]]
    modId="emi"
    mandatory=false
    versionRange="[1.1,)"
    ordering="AFTER"
    side="CLIENT"

[[dependencies.fabricate]]
    modId="jei"
    mandatory=false
    versionRange="[15,)"
    ordering="AFTER"
    side="CLIENT"

[[mixins]]
config="fabricate.mixins.json"
